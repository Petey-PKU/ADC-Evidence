name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADC_OFFLINE_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[generation]"
      - name: Compile package
        run: python -m compileall -q src tests
      - name: Audit public repository hygiene
        run: python scripts/audit_public_hygiene.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate public holdout separation
        run: python scripts/validate_public_holdout.py
      - name: Validate paper readiness remains fail-closed
        run: |
          set +e
          python scripts/audit_paper_readiness.py --output /tmp/paper_readiness.json
          status=$?
          set -e
          test "$status" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/paper_readiness.json').read_text())
          assert report['status'] == 'not_ready_for_submission'
          assert report['blocker_count'] == 2
          PY
      - name: Validate production Compose
        run: docker compose -f compose.prod.yaml config --quiet
      - name: Upload paper readiness audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-readiness-audit
          path: /tmp/paper_readiness.json
