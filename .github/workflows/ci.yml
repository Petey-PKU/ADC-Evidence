name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        dependency-profile: ["base", "generation"]
    env:
      ADC_OFFLINE_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          if [ "${{ matrix.dependency-profile }}" = "generation" ]; then
            python -m pip install -e ".[generation]"
          else
            python -m pip install -e .
          fi
      - name: Record dependency versions
        run: python -m pip freeze > /tmp/pip-freeze.txt
      - name: Bootstrap public demo database
        run: python -m adc_evidence.init_db --database data/processed/adc_evidence.db
      - name: Compile package
        run: python -m compileall -q src tests
      - name: Audit public repository hygiene
        run: python scripts/audit_public_hygiene.py --output /tmp/public_hygiene.json
      - name: Audit public ADC catalog
        run: |
          python scripts/audit_public_catalog.py --output /tmp/public_catalog_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('data/public/marketed_adc_catalog.audit.json').read_text())
          actual = json.loads(Path('/tmp/public_catalog_audit.json').read_text())
          assert actual == expected
          PY
      - name: Validate public benchmark manifest
        run: >-
          python scripts/validate_public_benchmark.py
          --questions data/annotations/public_benchmark_v1.jsonl
          --manifest data/annotations/public_benchmark_v1.manifest.json
          --catalog data/public/marketed_adc_catalog.csv
      - name: Build public artifact manifest
        run: python scripts/build_public_artifact_manifest.py --output /tmp/public_artifact_manifest.json
      - name: Validate reproducibility manifest metadata
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          manifest = json.loads(Path('/tmp/public_artifact_manifest.json').read_text())
          assert manifest['code_commit'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert manifest['package_version']
          assert manifest['release_ref']
          assert manifest['public_hygiene']['status'] == 'clean'
          PY
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate public holdout separation
        run: python scripts/validate_public_holdout.py
      - name: Run public offline smoke holdout
        run: >-
          python scripts/run_public_holdout.py
          --database data/processed/adc_evidence.db
          --questions data/annotations/v0.6_public_holdout_questions.jsonl
          --window-id ci-${{ matrix.python-version }}-${{ matrix.dependency-profile }}
          --output /tmp/public_holdout.json
      - name: Validate public smoke holdout metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/public_holdout.json').read_text())
          assert report['evaluation_use']['status'] == 'public_smoke_holdout'
          assert report['evaluation_use']['eligible_for_unseen_test_claim'] is False
          assert report['question_count'] == 20
          assert report['question_set_hash'].startswith('sha256:')
          assert report['question_id_sha256'].startswith('sha256:')
          assert all(not arm['network_enabled'] for arm in report['arms'].values())
          PY
      - name: Validate paper readiness remains fail-closed
        run: |
          set +e
          python scripts/audit_paper_readiness.py --output /tmp/paper_readiness.json
          status=$?
          set -e
          test "$status" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/paper_readiness.json').read_text())
          assert report['status'] == 'not_ready_for_submission'
          assert report['blocker_count'] == 2
          PY
      - name: Validate production Compose
        run: docker compose -f compose.prod.yaml config --quiet
      - name: Upload paper readiness audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-readiness-audit-${{ matrix.python-version }}-${{ matrix.dependency-profile }}
          path: /tmp/paper_readiness.json
      - name: Upload public hygiene audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-hygiene-audit-${{ matrix.python-version }}-${{ matrix.dependency-profile }}
          path: /tmp/public_hygiene.json
      - name: Upload public artifact manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-artifact-manifest-${{ matrix.python-version }}-${{ matrix.dependency-profile }}
          path: /tmp/public_artifact_manifest.json
      - name: Upload dependency versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-versions-${{ matrix.python-version }}-${{ matrix.dependency-profile }}
          path: /tmp/pip-freeze.txt
      - name: Upload public smoke holdout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-smoke-holdout-${{ matrix.python-version }}-${{ matrix.dependency-profile }}
          path: /tmp/public_holdout.json
