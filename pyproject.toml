[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adc-evidence"
version = "0.6.0"
description = "A small, evidence-oriented ADC research assistant MVP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "streamlit>=1.32,<2",
]

[project.optional-dependencies]
rag = [
  "sentence-transformers>=5.0,<6",
]
generation = [
  "openai>=1.68,<3",
  "python-dotenv>=1.0,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
